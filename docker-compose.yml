services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sheep_chatbot}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-00000000-0000-4000-8000-000000000001}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-demo@sheep.local}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME:-Sheep Demo User}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sheep_chatbot}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sheep_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 12

  db-init:
    build: .
    container_name: db-init
    command: ["python", "-m", "app.db.bootstrap"]
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sheep_chatbot}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-00000000-0000-4000-8000-000000000001}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-demo@sheep.local}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME:-Sheep Demo User}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q listeners | grep -q 'port: 5672, protocol: amqp'"]
      interval: 10s
      timeout: 5s
      retries: 12
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  
  celery-chat:
    build: .
    container_name: celery-chat
    command: celery -A app.celery_app.celery_app worker --loglevel=info -Q chat --concurrency=4 -E
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sheep_chatbot}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-00000000-0000-4000-8000-000000000001}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-demo@sheep.local}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME:-Sheep Demo User}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-stream:
    build: .
    container_name: celery-stream
    command: celery -A app.celery_app.celery_app worker --loglevel=info -Q stream --concurrency=4 -E
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sheep_chatbot}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-00000000-0000-4000-8000-000000000001}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-demo@sheep.local}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME:-Sheep Demo User}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  flower:
    build: .
    container_name: flower
    command: celery -A app.celery_app.celery_app flower --port=5555 --broker-api=${FLOWER_BROKER_API:-http://guest:guest@rabbitmq:15672/api/}
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sheep_chatbot}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-00000000-0000-4000-8000-000000000001}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-demo@sheep.local}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME:-Sheep Demo User}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - FLOWER_BROKER_API=${FLOWER_BROKER_API:-http://guest:guest@rabbitmq:15672/api/}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
      celery-chat:
        condition: service_started
      celery-stream:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
