version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  redis:
    image: redis:latest
    container_name: redis
  
  celery:
    build: .
    container_name: celery
    command: celery -A app.celery worker --loglevel=info
    depends_on:
      - redis
