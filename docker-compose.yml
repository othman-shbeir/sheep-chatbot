version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
    env_file:
      - .env
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
  
  celery:
    build: .
    container_name: celery
    command: celery -A app.celery_app.celery_app worker --loglevel=info -Q chat --concurrency=4
    depends_on:
      - redis
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
